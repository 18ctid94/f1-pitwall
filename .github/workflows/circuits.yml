name: Build Circuit Library
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build-circuits.py
      - uses: actions/upload-artifact@v4
        with:
          name: circuit-library
          path: |
            public/circuits.json
            circuit-report.json
