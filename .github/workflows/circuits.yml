name: Build Circuit Library
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install fonttools==4.63.0
      - run: python3 scripts/build-circuits.py
      - run: git diff --exit-code -- public/circuits.json circuit-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: circuit-library
          path: |
            public/circuits.json
            circuit-report.json
