name: Validate Circuit Data
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install numpy==2.2.6 scipy==1.15.3
      - name: Run diagnostics
        run: python scripts/validate-circuit-data.py
      - name: Upload aggregate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: circuit-validation-report-v3
          path: circuit-validation-report.json
          if-no-files-found: warn
          retention-days: 7
