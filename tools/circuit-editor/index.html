<!doctype html><html lang="en"><meta charset="utf-8"><title>PITWALL Annotation Editor V2</title><style>body{background:#10171c;color:#eee;font:16px system-ui;max-width:960px;margin:24px auto;padding:16px}button,select,input{background:#24323b;color:white;border:1px solid #52636e;padding:9px;margin:5px}svg{width:100%;max-height:520px;background:#18232b;touch-action:none}small{color:#aab8bf}label{display:inline-block}button{cursor:pointer}</style><h1>PITWALL · Annotation Editor V2</h1><p>Local draft only. Use independently permitted references. No API calls or publication.</p><label>Geometry JSON <input type="file" id="file" accept=".json"></label><label>Draft import <input type="file" id="imp" accept=".json"></label><p><select id="gp"></select><label>Turn <input id="turn" type="text" value="1" style="width:65px"></label><select id="mode"><option value="anchor">Track anchor (snap)</option><option value="label">Label anchor</option><option value="start">Start / finish</option><option value="sector1">Sector 1 end</option><option value="sector2">Sector 2 end</option><option value="pit">Pit path (append)</option></select><button id="auto">Auto place labels</button><button id="review">Mark reference reviewed</button><button id="del">Clear selected</button></p><svg id="map" viewBox="0 0 320 200"></svg><p id="status"></p><label>Reference / permission notes <input id="source" size="45"></label><button id="export">Export draft JSON</button><p><small>Geometry: F1DB / Jules Roy, CC BY 4.0; existing PITWALL normalized samples. <a style="color:#00d2be" href="https://creativecommons.org/licenses/by/4.0/">License</a>. Drafts are not verified or production compatible.</small></p><script>
const $=id=>document.getElementById(id), svg=$('map'); let assets={},drafts={}; const ns='http://www.w3.org/2000/svg'; function el(tag,attrs,txt){let e=document.createElementNS(ns,tag);for(let k in attrs)e.setAttribute(k,attrs[k]);if(txt)e.textContent=txt;svg.append(e);return e}function current(){return drafts[$('gp').value]??= {corners:{},pit:[]}}function points(){return assets[$('gp').value]?.coordinates||[]}function draw(){svg.replaceChildren();let p=points();if(!p.length)return;let d=current();el('polyline',{points:p.map(a=>a.join(',')).join(' '),fill:'none',stroke:'#8597a2','stroke-width':2});for(let [n,c] of Object.entries(d.corners)){if(!c.anchor)continue;let a=c.anchor,l=c.label||a;if(c.transformed){let t=c.transformed;el('line',{x1:t[0],y1:t[1],x2:a[0],y2:a[1],stroke:'#ff9860'});el('circle',{cx:t[0],cy:t[1],r:2,fill:'#ff9860'});}el('line',{x1:a[0],y1:a[1],x2:l[0],y2:l[1],stroke:'#aaa'});el('circle',{cx:a[0],cy:a[1],r:2.5,fill:'#00d2be'});el('text',{x:l[0],y:l[1],fill:n==$('turn').value?'#00d2be':'white','font-size':8,'text-anchor':'middle'},n)}for(let k of ['start','sector1','sector2'])if(d[k])el('circle',{cx:d[k][0],cy:d[k][1],r:4,fill:k==='start'?'white':'orange'});if(d.pit.length)el('polyline',{points:d.pit.map(a=>a.join(',')).join(' '),fill:'none',stroke:'orange','stroke-width':2});$('status').textContent=`${assets[$('gp').value].layoutId} · ${Object.values(d.corners).filter(c=>c.anchor).length} anchors · ${d.status||'UNREVIEWED'} · selected error: ${d.corners[$('turn').value]?.error?.toFixed(2)??'—'} · RELEASE BLOCKED`;}
$('file').onchange=async e=>{try{assets=JSON.parse(await e.target.files[0].text());$('gp').replaceChildren(...Object.keys(assets).filter(k=>Array.isArray(assets[k].coordinates)).map(k=>new Option(k,k)));draw()}catch(e){alert(e.message)}};$('gp').onchange=draw;$('turn').oninput=draw;svg.onclick=e=>{let p=points();if(!p.length)return;let pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;pt=pt.matrixTransform(svg.getScreenCTM().inverse());let xy=[Math.max(0,Math.min(320,pt.x)),Math.max(0,Math.min(200,pt.y))].map(x=>+x.toFixed(3));let snap=p.reduce((a,b)=>Math.hypot(b[0]-xy[0],b[1]-xy[1])<Math.hypot(a[0]-xy[0],a[1]-xy[1])?b:a);let d=current();d.status='UNREVIEWED';let m=$('mode').value,n=$('turn').value;if(m==='anchor'||m==='label'){if(!/^[1-9][0-9]*[A-Za-z]?$/.test(n))return;let c=d.corners[n]??={};c[m]=m==='anchor'?snap:xy;if(c.transformed)c.error=Math.hypot(c.transformed[0]-c.anchor[0],c.transformed[1]-c.anchor[1]);if(m==='anchor'&&!c.label)c.label=[Math.min(312,snap[0]+10),Math.max(8,snap[1]-10)]}else if(m==='pit')d.pit.push(xy);else d[m]=snap;draw()};$('auto').onclick=()=>{if(!points().length)return;let d=current(),used=[];for(let c of Object.values(d.corners)){if(!c.anchor)continue;let best=null,score=Infinity;for(let r of [12,20,30,42])for(let i=0;i<16;i++){let a=i*Math.PI/8,x=c.anchor[0]+r*Math.cos(a),y=c.anchor[1]+r*Math.sin(a);if(x<12||x>308||y<10||y>190)continue;let cost=r+used.reduce((s,p)=>s+Math.max(0,20-Math.hypot(x-p[0],y-p[1]))*100,0)+Math.max(0,8-Math.min(...points().map(p=>Math.hypot(x-p[0],y-p[1]))))*20;if(cost<score){score=cost;best=[x,y]}}if(best){c.label=best;used.push(best)}}d.status='UNREVIEWED';draw()};$('review').onclick=()=>{if(!points().length||!$('source').value.trim())return alert('Enter independent reference notes first');current().status='REFERENCE_REVIEWED_BY_OPERATOR';current().reference=$('source').value;draw()};$('del').onclick=()=>{if(!points().length)return;let d=current();d.status='UNREVIEWED';let m=$('mode').value;if(m==='anchor'||m==='label')delete d.corners[$('turn').value];else if(m==='pit')d.pit.pop();else delete d[m];draw()};$('export').onclick=()=>{let data={schema:'pitwall-editor-draft-v1',release:'BLOCKED',reference:$('source').value,drafts};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='pitwall-annotation-draft.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('imp').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(x.schema!=='pitwall-editor-draft-v1')throw Error('Wrong schema');drafts=x.drafts;$('source').value=x.reference||'';draw()}catch(e){alert(e.message)}};
</script></html>
