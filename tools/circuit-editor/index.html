<!doctype html><html lang="en"><meta charset="utf-8"><title>PITWALL Annotation Editor V4.1</title><style>body{background:#10171c;color:#eee;font:16px system-ui;max-width:960px;margin:24px auto;padding:16px}button,select,input{background:#24323b;color:white;border:1px solid #52636e;padding:9px;margin:5px}svg{width:100%;max-height:520px;background:#18232b;touch-action:none}small{color:#aab8bf}label{display:inline-block}button{cursor:pointer}</style><h1>PITWALL · Annotation Editor V4.1</h1><p>Local draft only. Use independently permitted references. No API calls or publication.</p><label>Geometry JSON <input type="file" id="file" accept=".json"></label><label>Draft import <input type="file" id="imp" accept=".json"></label><p><select id="gp"></select><label>Turn <input id="turn" type="text" value="1" style="width:65px"></label><select id="mode"><option value="anchor">Track anchor (snap)</option><option value="label">Label anchor</option><option value="start">Start / finish</option><option value="sector1">Sector 1 end</option><option value="sector2">Sector 2 end</option><option value="pit">Pit path (append)</option></select><button id="auto">Auto place labels</button><button id="review">Mark reference reviewed</button><button id="del">Clear selected</button></p><p><button id="native">Detect current layout</button><button id="pilot">Detect six pilot layouts</button><button id="all">Detect all layouts</button><button id="report">Export native report</button><label>Candidate ID <input id="candidate" size="5" placeholder="C01"></label><button id="assign">Assign candidate to Turn</button></p><p id="nativeStatus"></p><p id="progress"></p><svg id="map" viewBox="0 0 320 200"></svg><p id="status"></p><label>Reference / permission notes <input id="source" size="45"></label><button id="export">Export draft JSON</button><p><small>Geometry: F1DB / Jules Roy, CC BY 4.0; existing PITWALL normalized samples. <a style="color:#00d2be" href="https://creativecommons.org/licenses/by/4.0/">License</a>. Drafts are not verified or production compatible.</small></p><script src="native-engine.js"></script><script>
const $=id=>document.getElementById(id), svg=$('map'); let assets={},drafts={},nativeResults={}; const catalog=[{"gp": "Australia", "layout": "melbourne-2", "expected": 14, "status": "CANDIDATE", "years": [2025, 2026]}, {"gp": "Japan", "layout": "suzuka-2", "expected": 18, "status": "CANDIDATE", "years": [2025, 2026]}, {"gp": "Miami", "layout": "miami-1", "expected": 19, "status": "CANDIDATE", "years": [2025, 2026]}, {"gp": "Emilia Romagna", "layout": "imola-3", "expected": 19, "status": "CANDIDATE", "years": [2025]}, {"gp": "Monaco", "layout": "monaco-6", "expected": 19, "status": "CANDIDATE", "years": [2025, 2026]}, {"gp": "Spain", "layout": "catalunya-6", "expected": 14, "status": "CANDIDATE", "years": [2025, 2026]}, {"gp": "Canada", "layout": "montreal-6", "expected": 14, "status": "CANDIDATE", "years": [2025, 2026]}, {"gp": "Austria", "layout": "spielberg-3", "expected": 10, "status": "CANDIDATE", "years": [2025, 2026]}, {"gp": "Great Britain", "layout": "silverstone-8", "expected": 18, "status": "CANDIDATE", "years": [2025, 2026]}, {"gp": "Netherlands", "layout": "zandvoort-5", "expected": 14, "status": "CANDIDATE", "years": [2025, 2026]}, {"gp": "Italy", "layout": "monza-7", "expected": 11, "status": "CANDIDATE", "years": [2025, 2026]}, {"gp": "United States", "layout": "austin-1", "expected": 20, "status": "CANDIDATE", "years": [2025, 2026]}, {"gp": "Mexico", "layout": "mexico-city-3", "expected": 17, "status": "CANDIDATE", "years": [2025, 2026]}, {"gp": "Brazil", "layout": "interlagos-2", "expected": 15, "status": "CANDIDATE", "years": [2025, 2026]}, {"gp": "Las Vegas", "layout": "las-vegas-1", "expected": 17, "status": "CANDIDATE", "years": [2025, 2026]}, {"gp": "Qatar", "layout": "lusail-1", "expected": 16, "status": "CANDIDATE", "years": [2025, 2026]}, {"gp": "China", "layout": "shanghai-1", "expected": 16, "status": "REVIEW", "years": [2025, 2026]}, {"gp": "Bahrain", "layout": "bahrain-1", "expected": 15, "status": "REVIEW", "years": [2025, 2026]}, {"gp": "Saudi Arabia", "layout": "jeddah-1", "expected": 27, "status": "REVIEW", "years": [2025, 2026]}, {"gp": "Belgium", "layout": "spa-francorchamps-4", "expected": 19, "status": "REVIEW", "years": [2025, 2026]}, {"gp": "Hungary", "layout": "hungaroring-3", "expected": 14, "status": "REVIEW_COUNT", "years": [2025, 2026]}, {"gp": "Azerbaijan", "layout": "baku-1", "expected": 20, "status": "REVIEW", "years": [2025, 2026]}, {"gp": "Singapore", "layout": "marina-bay-4", "expected": 19, "status": "REVIEW", "years": [2025, 2026]}, {"gp": "Abu Dhabi", "layout": "yas-marina-2", "expected": 16, "status": "REVIEW", "years": [2025, 2026]}, {"gp": "Madrid", "layout": "madring-1", "expected": 22, "status": "API_BLOCKED", "years": [2026]}]; const legacy={"corners": {"1": {"anchor": [41.029, 179.924], "label": [18, 187]}, "2": {"anchor": [50.179, 163.635], "label": [73, 163]}, "3": {"anchor": [45.644, 138.979], "label": [24, 140]}, "4": {"anchor": [68.686, 16.251], "label": [60, 2]}, "5": {"anchor": [108.493, 51.671], "label": [102, 39]}, "6": {"anchor": [124.11, 65.945], "label": [142, 47]}, "7": {"anchor": [126.11, 87.652], "label": [105, 94]}, "8": {"anchor": [161.265, 119.65], "label": [170, 107]}, "9": {"anchor": [113.858, 124.915], "label": [130, 145]}, "10": {"anchor": [79.861, 133.495], "label": [67, 117]}, "11": {"anchor": [215.345, 130.163], "label": [231, 137]}, "12": {"anchor": [168.401, 78.049], "label": [148, 78]}, "13": {"anchor": [193.177, 27.816], "label": [193, 10]}, "14": {"anchor": [279.509, 168.563], "label": [302, 170]}, "15": {"anchor": [266.027, 181.108], "label": [269, 198]}}, "pit": [], "start": [134.11, 184.0], "status": "UNREVIEWED", "reference": "FIA 2025 Bahrain Circuit Map V4; schematic alignment to F1DB", "layout": "bahrain-1", "legacy": true}; const ns='http://www.w3.org/2000/svg'; function el(tag,attrs,txt){let e=document.createElementNS(ns,tag);for(let k in attrs)e.setAttribute(k,attrs[k]);if(txt)e.textContent=txt;svg.append(e);return e}function current(){return drafts[$('gp').value]??= {corners:{},pit:[]}}function points(){return assets[$('gp').value]?.coordinates||[]}function draw(){ $('progress').textContent=`${catalog.filter(t=>Object.values(drafts[t.gp]?.corners||{}).some(c=>c.anchor)).length}/25 layouts with anchors · ${catalog.filter(t=>drafts[t.gp]?.status==='REFERENCE_REVIEWED_BY_OPERATOR').length}/25 operator reviewed`; svg.replaceChildren();let p=points();if(!p.length)return;let d=current();el('polyline',{points:p.map(a=>a.join(',')).join(' '),fill:'none',stroke:'#8597a2','stroke-width':2});for(let [n,c] of Object.entries(d.corners)){if(!c.anchor)continue;let a=c.anchor,l=safeLabel(c.label||a,n);if(c.transformed){let t=c.transformed;el('line',{x1:t[0],y1:t[1],x2:a[0],y2:a[1],stroke:'#ff9860'});el('circle',{cx:t[0],cy:t[1],r:2,fill:'#ff9860'});}el('line',{x1:a[0],y1:a[1],x2:l[0]+(a[0]-l[0])*Math.min(0.8,5/(Math.hypot(a[0]-l[0],a[1]-l[1])||1)),y2:l[1]+(a[1]-l[1])*Math.min(0.8,5/(Math.hypot(a[0]-l[0],a[1]-l[1])||1)),stroke:'#aaa'});el('circle',{cx:a[0],cy:a[1],r:2.5,fill:'#00d2be'});el('text',{x:l[0],y:l[1],fill:n==$('turn').value?'#00d2be':'white','font-size':8,'text-anchor':'middle','dominant-baseline':'central'},n)}for(let k of ['start','sector1','sector2'])if(d[k])el('circle',{cx:d[k][0],cy:d[k][1],r:4,fill:k==='start'?'white':'orange'});if(d.pit.length)el('polyline',{points:d.pit.map(a=>a.join(',')).join(' '),fill:'none',stroke:'orange','stroke-width':2});for(const c of nativeResults[$('gp').value]?.candidates||[]){let a=c.anchor;el('circle',{cx:a[0],cy:a[1],r:2,fill:'none',stroke:'#ffb45c','stroke-width':1});let l=safeLabel([a[0]+5,a[1]-6],c.id);el('text',{x:l[0],y:l[1],fill:'#ffb45c','font-size':5,'text-anchor':'middle'},c.id)}let nr=nativeResults[$('gp').value];$('nativeStatus').textContent=nr?`Native candidates: ${nr.candidates.length}/${nr.expected} expected · ${nr.status} · V6 baseline ${nr.baselineCount??'—'} · NOT official turn numbers`: 'Native candidates not generated';$('status').textContent=`${assets[$('gp').value].layoutId} · ${Object.values(d.corners).filter(c=>c.anchor).length} anchors · ${d.status||'UNREVIEWED'} · selected error: ${d.corners[$('turn').value]?.error?.toFixed(2)??'—'} · RELEASE BLOCKED`;}
$('file').onchange=async e=>{try{assets=JSON.parse(await e.target.files[0].text());nativeResults={};$('gp').replaceChildren(...catalog.filter(t=>assets[t.gp]?.layoutId===t.layout).map(t=>new Option(`${t.gp} · ${t.expected} expected turns`,t.gp)));if(!drafts.Bahrain&&assets.Bahrain?.layoutId==='bahrain-1')drafts.Bahrain=structuredClone(legacy);draw()}catch(e){alert(e.message)}};$('gp').onchange=()=>{$('source').value=current().reference||'';draw()};$('turn').oninput=draw;svg.onclick=e=>{let p=points();if(!p.length)return;let pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;pt=pt.matrixTransform(svg.getScreenCTM().inverse());let xy=[Math.max(0,Math.min(320,pt.x)),Math.max(0,Math.min(200,pt.y))].map(x=>+x.toFixed(3));let snap=p.reduce((a,b)=>Math.hypot(b[0]-xy[0],b[1]-xy[1])<Math.hypot(a[0]-xy[0],a[1]-xy[1])?b:a);let d=current();d.status='UNREVIEWED';let m=$('mode').value,n=$('turn').value;if(m==='anchor'||m==='label'){if(!/^[1-9][0-9]*[A-Za-z]?$/.test(n))return;let c=d.corners[n]??={};c[m]=m==='anchor'?snap:xy;if(c.transformed&&c.anchor)c.error=Math.hypot(c.transformed[0]-c.anchor[0],c.transformed[1]-c.anchor[1]);if(m==='anchor'&&!c.label)c.label=[Math.min(312,snap[0]+10),Math.max(8,snap[1]-10)]}else if(m==='pit')d.pit.push(xy);else d[m]=snap;draw()};$('auto').onclick=()=>{if(!points().length)return;let d=current(),used=[];for(let c of Object.values(d.corners)){if(!c.anchor)continue;let best=null,score=Infinity;for(let r of [12,20,30,42])for(let i=0;i<16;i++){let a=i*Math.PI/8,x=c.anchor[0]+r*Math.cos(a),y=c.anchor[1]+r*Math.sin(a);if(x<16||x>304||y<12||y>188)continue;let cost=r+used.reduce((s,p)=>s+Math.max(0,20-Math.hypot(x-p[0],y-p[1]))*100,0)+Math.max(0,8-Math.min(...points().map(p=>Math.hypot(x-p[0],y-p[1]))))*20;if(cost<score){score=cost;best=[x,y]}}if(best){c.label=best;used.push(best)}else c.label=safeLabel(c.label||c.anchor,'99A')}d.status='UNREVIEWED';draw()};$('review').onclick=()=>{if(!points().length||!$('source').value.trim())return alert('Enter independent reference notes first');current().status='REFERENCE_REVIEWED_BY_OPERATOR';current().reference=$('source').value;draw()};$('del').onclick=()=>{if(!points().length)return;let d=current();d.status='UNREVIEWED';let m=$('mode').value;if(m==='anchor'||m==='label')delete d.corners[$('turn').value];else if(m==='pit')d.pit.pop();else delete d[m];draw()};$('export').onclick=()=>{let data={schema:'pitwall-editor-draft-v1',release:'BLOCKED',reference:'Local draft only',drafts,nativeResults};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='pitwall-annotation-draft.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('imp').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(x.schema!=='pitwall-editor-draft-v1')throw Error('Wrong schema');if(!x.drafts||typeof x.drafts!=='object')throw Error('Missing drafts'); if(!confirm('Replace current workspace with imported draft?'))return; drafts=x.drafts;nativeResults=x.nativeResults||{}; if(!drafts.Bahrain&&assets.Bahrain?.layoutId==='bahrain-1')drafts.Bahrain=structuredClone(legacy);$('source').value=current().reference||'';draw()}catch(e){alert(e.message)}};
function safeLabel(a,n){let m=Math.max(12,String(n).length*3+4);return [Math.max(m,Math.min(320-m,a[0])),Math.max(12,Math.min(188,a[1]))]}
function runNative(gp){let t=catalog.find(t=>t.gp===gp);if(!t||assets[gp]?.layoutId!==t.layout)throw Error('Load matching geometry first');let candidates=PitwallNative.detect(assets[gp].coordinates),baseline=PitwallNative.detect(assets[gp].coordinates,{baseline:true});nativeResults[gp]={layout:t.layout,expected:t.expected,candidates,baselineCount:baseline.length,benchmark:gp==='Bahrain'?{adaptive:PitwallNative.benchmark(candidates,legacy.corners),baseline:PitwallNative.benchmark(baseline,legacy.corners)}:null,status:candidates.length===t.expected?'COUNT_MATCH_UNVERIFIED':'COUNT_REVIEW'};}
$('native').onclick=()=>{try{runNative($('gp').value);draw()}catch(e){alert(e.message)}};
$('pilot').onclick=()=>{try{for(const gp of ['Bahrain','Italy','Japan','Monaco','Saudi Arabia','Madrid'])runNative(gp);draw();alert('Six pilot layouts processed. Export native report for review.')}catch(e){alert(e.message)}};
$('all').onclick=()=>{let errors=[];for(const t of catalog){try{runNative(t.gp)}catch(e){errors.push(t.gp+': '+e.message)}}draw();alert(`${Object.keys(nativeResults).length}/25 layouts processed. ${errors.join('; ')}`)};
$('report').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({schema:'pitwall-native-report-v1',engine:'6.1',release:'BLOCKED',source:'F1DB / Jules Roy CC BY 4.0; geometry-derived candidates',results:nativeResults},null,2)],{type:'application/json'}));a.download='pitwall-native-report-v6.1.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$('assign').onclick=()=>{let n=$('turn').value,c=nativeResults[$('gp').value]?.candidates.find(c=>c.id===$('candidate').value.toUpperCase().trim());if(!c||!/^[1-9][0-9]*[A-Za-z]?$/.test(n))return alert('Select valid candidate and turn');let d=current();if(d.corners[n]?.anchor&&!confirm('Replace existing turn anchor?'))return;d.corners[n]={anchor:[...c.anchor],label:safeLabel([c.anchor[0]+12,c.anchor[1]-12],n),nativeCandidate:c.id};d.status='UNREVIEWED';draw()};
